name: Publish SSD Setup v0.2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-ssd-setup-v0.2.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ssd-setup-v0.2-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'Kallone62/my-pc-optimization'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Assemble install-only ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ROOT="dist/SSD Setup"
          mkdir -p "$ROOT/.drivers/Assets"
          cp -a .bios "$ROOT/.bios"
          cp -a .scripts "$ROOT/.scripts"
          cp -a "After Game Update" "$ROOT/After Game Update"
          cp -a Game "$ROOT/Game"
          cp -a Keyboard "$ROOT/Keyboard"
          cp -a Training "$ROOT/Training"
          cp -a .drivers/Assets/Monitor "$ROOT/.drivers/Assets/Monitor"

          cp .drivers/Download_Gaming_Drivers.cmd "$ROOT/.drivers/"
          cp .drivers/Install_NVIDIA_Control_Panel.cmd "$ROOT/.drivers/"
          cp .drivers/Download-Gaming-Drivers.ps1 "$ROOT/.drivers/"
          cp Download_PostFormat_Apps.cmd "$ROOT/"
          cp Run_CS2_Gaming_Scripts.cmd "$ROOT/"
          cp docs/DOWNLOAD_ONLY.md "$ROOT/DOWNLOAD_ONLY.md"

          gh release download v0.1 --pattern SSD_Setup_v0.1.zip --dir "$RUNNER_TEMP/v01"

          cat > "$ROOT/INSTALL_README.txt" <<'INSTRUCTIONS'
          SSD Setup v0.2 — CS2 espor sistemi / CS2 esports system
          Güncel platform / Current platform: Ryzen 7 9800X3D, ASUS ROG STRIX B850-I, RTX 3080 12 GB
          
          TÜRKÇE
          
          1. ZIP'i klasör yapısını koruyarak çıkarın (.bios, .drivers, .scripts dahil).
          2. Sürücü paketleri: .drivers\Download_Gaming_Drivers.cmd
          3. Uygulama paketleri: Download_PostFormat_Apps.cmd
             İki script de indirir ve doğrular; kurulum yapmaz.
          4. Sonuçları Downloads\Drivers\DRIVER_MANUAL_INSTALL_ORDER.csv ve
             Downloads\Apps\APP_MANUAL_INSTALL_ORDER.csv üzerinden kontrol edip
             uygun paketleri manuel kurun.
          5. NVIDIA driver kurulumu + reboot sonrasında
             Downloads\Drivers\Install_NVIDIA_Control_Panel.cmd dosyasını çalıştırın.
             Bu araç NVIDIA Control Panel'i Microsoft Store'dan kurar.
          6. Run_CS2_Gaming_Scripts.cmd Windows, device, network ve security
             baseline'ını uygular; ayarları gerçekten değiştirir.
          7. Game\autoexec.cfg CS2 konfigürasyonumdur.
          8. Training\KOVAAKS_CS2_STANDARD_V1.zip Apply/Restore scriptlerini içerir.
          9. After Game Update\shadercachereset.bat isteğe bağlı shader cache cleanup aracıdır.
          10. .bios/current/ROG-B850-I aktif platform kaydı için ayrıldı;
              .bios/legacy/Z690-Tachyon eski sistemin BIOS arşividir.
          
          ENGLISH
          
          1. Extract the ZIP while preserving hidden folders and paths.
          2. Run .drivers\Download_Gaming_Drivers.cmd for driver packages.
          3. Run Download_PostFormat_Apps.cmd for application packages.
             Both download and verify packages; neither installs them.
          4. Review the two CSV manifests under Downloads\Drivers and Downloads\Apps
             and install the verified matching packages manually.
          5. After installing the NVIDIA driver and rebooting, run
             Downloads\Drivers\Install_NVIDIA_Control_Panel.cmd for the Store app.
          6. Run_CS2_Gaming_Scripts.cmd applies actual Windows/device/network/security
             configuration changes. Game\autoexec.cfg holds my CS2 settings.
          7. Training contains KovaaK apply/restore tools; After Game Update
             contains optional shader cache cleanup.
          8. BIOS archives are separated into current B850-I and legacy Z690.
          
          Windows imaging tool 00_Fresh_Install_W11_Pro.cmd formats D:;
          it is deliberately excluded from this release ZIP.
          Kurulum ayrıntıları / Details: DOWNLOAD_ONLY.md
          
          INSTRUCTIONS

          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          root=Path("dist/SSD Setup")
          required = [
              ".drivers/Download_Gaming_Drivers.cmd",
              ".drivers/Install_NVIDIA_Control_Panel.cmd",
              ".drivers/Download-Gaming-Drivers.ps1",
              ".drivers/Assets/Monitor/XL2566X+_WHQL dirver_V001_Windows_240605180238.7z",
              ".scripts/Download-PostFormat-Apps.ps1",
              ".scripts/Download-Transport.ps1",
              ".scripts/CS2-GamingOnly-Pro-v1.0.9.ps1",
              ".scripts/I226V_Baseline_v2.ps1",
              ".scripts/Gaming-Device-Disable-v2.ps1",
              ".scripts/Gaming-Background-Cleanup-v1.ps1",
              ".scripts/PostFormat-Policy-Baseline-v1.ps1",
              ".scripts/WU-Driver-Scan-v1.ps1",
              ".scripts/PostFormat-LowRisk-Background-v1.ps1",
              ".scripts/PostFormat-App-Privacy-Capabilities-v1.ps1",
              ".scripts/Gaming-Device-Power-Baseline-v1.ps1",
              "Training/KOVAAKS_CS2_STANDARD_V1.zip",
              "After Game Update/shadercachereset.bat",
              "Game/autoexec.cfg",
              "Keyboard/wootility.io.txt",
              "Download_PostFormat_Apps.cmd",
              "Run_CS2_Gaming_Scripts.cmd",
              "DOWNLOAD_ONLY.md",
              "INSTALL_README.txt",
              ".bios/current/ROG-B850-I/README.md"
          ]
          missing=[p for p in required if not (root/p).is_file()]
          if missing:
              raise SystemExit("Missing dependencies: "+", ".join(missing))
          with zipfile.ZipFile(root/"Training/KOVAAKS_CS2_STANDARD_V1.zip") as nested:
              assert nested.testzip() is None, "KovaaK ZIP is corrupt"
              assert any(n.endswith("Apply-KOVAAKS-CS2-STANDARD.ps1") for n in nested.namelist())
              assert any(n.endswith("Restore-Last-Backup.ps1") for n in nested.namelist())
          print("Required install, training and maintenance files verified")
          PY

          (cd dist && zip -q -r SSD_Setup_v0.2.zip "SSD Setup")
          python3 - <<'PY'
          from zipfile import ZipFile
          import os
          p="dist/SSD_Setup_v0.2.zip"
          with ZipFile(p) as z:
              assert z.testzip() is None
              names=set(z.namelist())
              must=["SSD Setup/Training/KOVAAKS_CS2_STANDARD_V1.zip",
                    "SSD Setup/After Game Update/shadercachereset.bat",
                    "SSD Setup/.bios/README.md",
                    "SSD Setup/.drivers/Download_Gaming_Drivers.cmd",
                    "SSD Setup/.drivers/Install_NVIDIA_Control_Panel.cmd",
                    "SSD Setup/Run_CS2_Gaming_Scripts.cmd",
                    "SSD Setup/DOWNLOAD_ONLY.md"]
              assert set(must).issubset(names)
              assert not any(n.endswith("00_Fresh_Install_W11_Pro.cmd") for n in names)
              assert not any("FINAL_AUDIT" in n or "Test_WU_Driver_Scan_Once" in n for n in names)
              with ZipFile(os.path.join(os.environ["RUNNER_TEMP"], "v01", "SSD_Setup_v0.1.zip")) as previous:
                  assert previous.testzip() is None
                  expected = {n for n in previous.namelist() if not n.endswith("/")}
              renamed = {
                  "SSD Setup/.drivers/Install-Gaming-Drivers-v2-LatestOfficial.ps1":
                      "SSD Setup/.drivers/Download-Gaming-Drivers.ps1",
                  "SSD Setup/.scripts/Install-PostFormat-Apps.ps1":
                      "SSD Setup/.scripts/Download-PostFormat-Apps.ps1",
              }
              assert set(renamed).issubset(expected), "Unexpected v0.1 source paths"
              expected = {renamed.get(n, n) for n in expected}
              expected.update({
                  "SSD Setup/.scripts/Download-Transport.ps1",
                  "SSD Setup/.drivers/Install_NVIDIA_Control_Panel.cmd",
              })
              actual = {n for n in names if not n.endswith("/")}
              assert actual == expected, f"Unexpected release scope: added={sorted(actual-expected)}, missing={sorted(expected-actual)}"
              print("v0.1 package scope verified with only required current dependencies:", len(actual), "files")
          PY
          sha256sum dist/SSD_Setup_v0.2.zip

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/ssd-setup-release-notes.md <<'NOTES'
          SSD Setup v0.2 — CS2 Espor Sistemi Optimizasyonu / Esports System Optimization
          
          TÜRKÇE
          Güncel Ryzen 7 9800X3D / B850-I / RTX 3080 sistemi için
          driver, uygulama, Windows ve CS2 yapılandırmalarım.
          
          v0.1'e göre değişiklikler:
          - Driver/app downloader'larında ortak HTTPS transport, kontrollü
          retry, resume ve doğrulanmış dosyayı tekrar kullanma.
          - WinGet için geçici WinINet backend seçimi ve ayar restore/backup.
          - TechPowerUp Visual C++ All-in-One ve DirectX web installer.
          - Önceki sistemin BIOS export'ları arşivde korunuyor.
          
          Driver/app downloader'ları paketleri indirir ve doğrular; kurmaz.
          Windows/CS2 launcher'ı sistem ayarlarını gerçekten değiştirir.
          D: formatlayan Windows imaging aracı bu ZIP'e dahil değil.
          CI paket bütünlüğünü kontrol eder; Windows/FACEIT canlı testleri ayrı.
          Kurulum: INSTALL_README.txt.
          
          ENGLISH
          Setup for my current Ryzen 7 9800X3D / B850-I / RTX 3080 PC.
          Changes since v0.1: shared HTTPS downloader with retry, resume and
          verified-cache reuse; temporary WinINet backend for WinGet;
          TechPowerUp Visual C++ bundle and DirectX web installer.
          The previous platform's BIOS exports remain archived.
          
          Downloaders verify packages without installing them. The Windows/CS2
          launcher applies system changes. The D:-formatting Windows imaging
          tool is excluded. CI verifies ZIP integrity; Windows/FACEIT runtime
          validation remains separate.
          Setup: INSTALL_README.txt inside the ZIP.
          NOTES
          if gh release view v0.2 >/dev/null 2>&1; then
            gh release upload v0.2 dist/SSD_Setup_v0.2.zip --clobber
            if gh release view v0.2 --json assets --jq '.assets[].name' | grep -Fxq SSD_Setup_v0.2_SHA256SUMS.txt; then
              gh release delete-asset v0.2 SSD_Setup_v0.2_SHA256SUMS.txt --yes
            fi
            gh release edit v0.2 --notes-file /tmp/ssd-setup-release-notes.md
          else
            gh release create v0.2 dist/SSD_Setup_v0.2.zip \
              --target "$GITHUB_SHA" \
              --title "SSD Setup v0.2" \
              --notes-file /tmp/ssd-setup-release-notes.md
          fi
